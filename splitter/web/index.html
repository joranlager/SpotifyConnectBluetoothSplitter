<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bluetooth Splitter</title>
<meta name="description" content="Configure, control and monitor the Spotify to Bluetooth splitter.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ccircle cx='12' cy='12' r='10' fill='%230071e3'/%3E%3Ccircle cx='12' cy='12' r='3.5' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>

<!-- The app shell. The views (Dashboard, Speakers, Settings, Spotify client) are
     built by the ES modules under /static/ and routed with the URL hash. -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">Splitter<small id="brandSub">Spotify to Bluetooth</small></div>
    <span id="statePill" class="pill"><span class="dot"></span><span id="stateText">Connecting…</span></span>
    <button id="toggleBtn" class="btn" disabled>Start</button>
    <button id="restartBtn" class="icon-btn" title="Restart" aria-label="Restart streaming">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs" aria-label="Sections">
    <a href="#/" data-route="/">Dashboard</a>
    <a href="#/speakers" data-route="/speakers">Speakers</a>
    <a href="#/settings" data-route="/settings">Settings</a>
    <a href="#/setup" data-route="/setup" id="navSetup" class="hidden">Spotify client</a>
  </nav>
</header>

<main>
  <div id="banner" class="banner hidden" role="status">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v5M12 16.5v.01"/></svg>
    <div id="bannerText"></div>
  </div>
  <div id="view" tabindex="-1"><p class="loading">Loading…</p></div>
  <noscript><p class="loading">This page needs JavaScript.</p></noscript>
</main>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="offline-overlay" id="offline">Can’t reach the splitter. Retrying…</div>

</body>
</html>
